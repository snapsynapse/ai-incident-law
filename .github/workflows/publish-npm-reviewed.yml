name: Publish reviewed npm package

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm publication of the reviewed AI Incident Law v0.4.5 tarball
        required: true
        type: choice
        options:
          - publish-ai-incident-law-v0.4.5

permissions:
  contents: read

concurrency:
  group: ai-incident-law-npm-v0.4.5
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-ai-incident-law-v0.4.5'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the dispatch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported npm and OIDC
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify runner and release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)'
          npm_version=$(npm --version)
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version"
          git merge-base --is-ancestor 504f56ed741c9c719aceab2bb2b68b8f16031ac8 HEAD
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.4.5" --jq '.object | select(.type == "tag") | .sha')
          test -n "$tag_object"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '. | select(.object.sha == "504f56ed741c9c719aceab2bb2b68b8f16031ac8" and .verification.verified == true) | .tag' | grep -Fx 'v0.4.5'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.5" --jq '. | select(.id == 457660686 and .draft == false and .prerelease == false) | .assets[] | select(.name == "ai-incident-law-0.4.5.tgz" and .size == 297850 and .digest == "sha256:f90f9cf00e5c07f26091e7094f491bc253ddc25255e21ad3ab24e9505ff7eaa7") | .name' | grep -Fx 'ai-incident-law-0.4.5.tgz'

      - name: Download and inspect the immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download v0.4.5 --repo "$GITHUB_REPOSITORY" --pattern 'ai-incident-law-0.4.5.tgz' --dir "$RUNNER_TEMP/release"
          asset="$RUNNER_TEMP/release/ai-incident-law-0.4.5.tgz"
          test "$(sha256sum "$asset" | cut -d ' ' -f 1)" = 'f90f9cf00e5c07f26091e7094f491bc253ddc25255e21ad3ab24e9505ff7eaa7'
          tar -xOf "$asset" package/package.json | jq -e '.name == "ai-incident-law" and .version == "0.4.5" and .repository.url == "git+https://github.com/snapsynapse/ai-incident-law.git"'
          tar -xOf "$asset" package/server.json | jq -e '.version == "0.4.5" and .packages[0].identifier == "ai-incident-law" and .packages[0].version == "0.4.5"'

      - name: Confirm npm version is absent
        if: github.run_attempt == '1'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://registry.npmjs.org/ai-incident-law/0.4.5)
          test "$status" = 404

      - name: Publish exact reviewed tarball through npm OIDC
        if: github.run_attempt == '1'
        shell: bash
        run: npm publish "$RUNNER_TEMP/release/ai-incident-law-0.4.5.tgz" --access public --registry https://registry.npmjs.org/

      - name: Verify published npm tarball bytes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..37}; do
            # A fresh query avoids a cached 404 while npm processes a new version.
            if curl -fsS --max-time 15 "https://registry.npmjs.org/ai-incident-law/-/ai-incident-law-0.4.5.tgz?run=${GITHUB_RUN_ID}&attempt=${GITHUB_RUN_ATTEMPT}&probe=${attempt}" -o "$RUNNER_TEMP/published.tgz"; then
              test "$(sha256sum "$RUNNER_TEMP/published.tgz" | cut -d ' ' -f 1)" = 'f90f9cf00e5c07f26091e7094f491bc253ddc25255e21ad3ab24e9505ff7eaa7'
              exit 0
            fi
            if (( attempt < 37 )); then sleep 10; fi
          done
          exit 1
