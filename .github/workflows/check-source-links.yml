name: Check source links

# Frozen corpus: recurring source requests retired by owner decision 2026-11-18.
# Manual dispatch remains for separately selected bounded correction/access work.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-source-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check primary source links
        run: npm run check:links
