name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Full owner commit SHA to compare against (must precede HEAD)
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHECK_OF_REQUIRED: "1"
      OBLIGATION_FIRST_DIR: ${{ github.workspace }}/obligation-first
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: snapsynapse/obligation-first
          ref: 9445845d9cc7c13146b2bd53b875fe7ee7736d2a
          path: obligation-first

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Obligation-First dependencies
        run: npm ci --prefix obligation-first

      - name: Resolve owner admission comparison
        run: node obligation-first/scripts/resolve-admission-base.mjs --root . --github-env

      - name: Run canonical CI verification
        run: npm run verify:ci
