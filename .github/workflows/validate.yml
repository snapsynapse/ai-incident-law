name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHECK_OF_REQUIRED: "1"
      OBLIGATION_FIRST_DIR: ${{ github.workspace }}/obligation-first
      SOURCE_ADMISSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: snapsynapse/obligation-first
          ref: af66a287f078ff9d5b585fee198300d65596a36c
          path: obligation-first

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Obligation-First dependencies
        run: npm ci --prefix obligation-first

      - name: Run canonical CI verification
        run: npm run verify:ci
